[env:esp32doit-devkit-v1]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
    -Iinclude/dongco
    -Iinclude/mat

; Thêm thư mục chứa .cpp của các module vào src filter
build_src_filter =
    +<*>
    +<../include/dongco/*.cpp>
    +<../include/mat/*.cpp>
